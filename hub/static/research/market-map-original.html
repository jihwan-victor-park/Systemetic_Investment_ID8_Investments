<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID8 · Market Map Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1A1A; --paper:#FFFFFF; --surface:#F7F6F3;
  --line:#E4E3DE; --line2:#D8D7D1; --gray:#828282; --gray2:#A4A39E;
  --accent:#2B45D0; --accent-bg:#F0F2FC;
  --fresh:#2E7D32; --aging:#B4791F; --stale:#B4302B;
  --sans:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--sans);background:var(--surface);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.4;}
a{color:inherit;text-decoration:none;}

header{position:sticky;top:0;z-index:50;background:var(--ink);color:var(--paper);border-bottom:1px solid #000;}
.head-inner{max-width:1220px;margin:0 auto;padding:16px 28px 15px;}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:11px;}
.brand .name{font-size:16px;font-weight:700;letter-spacing:.2px;}
.logo-img{height:23px;width:auto;display:block;}
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:3px;color:var(--gray2);text-transform:uppercase;}
h1{font-weight:700;font-size:clamp(26px,4.2vw,38px);letter-spacing:-.5px;line-height:1.02;margin-top:13px;}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--gray2);margin-top:9px;letter-spacing:.4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.meta .dot{opacity:.4;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;}
.leg{font-family:var(--mono);font-size:10px;letter-spacing:.5px;color:var(--gray2);display:flex;align-items:center;gap:5px;text-transform:uppercase;}
.leg i{width:8px;height:8px;border-radius:50%;display:inline-block;}
.leg.f i{background:#5FB365;} .leg.a i{background:#D9A441;} .leg.s i{background:#D9615C;} .leg.u i{background:#8C8C8C;}

.controls{position:sticky;top:0;z-index:40;background:rgba(247,246,243,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.controls-inner{max-width:1220px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.search{flex:1;min-width:200px;position:relative;display:flex;align-items:center;}
.search svg{position:absolute;left:13px;pointer-events:none;}
.search input{width:100%;font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line2);border-radius:2px;padding:10px 12px 10px 36px;outline:none;letter-spacing:.3px;transition:border-color .15s,box-shadow .15s;}
.search input::placeholder{color:var(--gray2);}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
.seg{display:flex;border:1px solid var(--line2);border-radius:2px;overflow:hidden;background:var(--paper);}
.seg button{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:1px;text-transform:uppercase;padding:9px 13px;background:transparent;border:none;color:var(--gray);cursor:pointer;transition:background .15s,color .15s;white-space:nowrap;}
.seg button+button{border-left:1px solid var(--line2);}
.seg button.on{background:var(--ink);color:var(--paper);}
.seg.fresh button.on{background:var(--fresh);}
.seg.aging button.on{background:var(--aging);}
.seg.stale button.on{background:var(--stale);}

.pills{max-width:1220px;margin:0 auto;padding:13px 28px 2px;display:flex;gap:7px;flex-wrap:wrap;}
.pill{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.6px;color:var(--gray);background:var(--paper);border:1px solid var(--line);padding:6px 10px;border-radius:2px;cursor:pointer;transition:all .14s;white-space:nowrap;}
.pill:hover{border-color:var(--ink);color:var(--ink);}
.pill b{color:var(--ink);font-weight:700;margin-right:6px;}
.pill .ct{color:var(--gray2);margin-left:5px;}

main{max-width:1220px;margin:0 auto;padding:20px 28px 80px;}
.section{margin-top:34px;scroll-margin-top:150px;}
.section:first-child{margin-top:16px;}
.sec-head{display:flex;align-items:baseline;gap:13px;padding-bottom:11px;margin-bottom:16px;border-bottom:1px solid var(--line2);}
.code{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:1px;color:var(--paper);background:var(--ink);padding:3px 7px;border-radius:2px;align-self:center;}
.code.firm{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:2px 6px;}
.sec-title{font-size:19px;font-weight:700;letter-spacing:-.2px;}
.sec-count{font-family:var(--mono);font-size:11px;color:var(--gray2);margin-left:auto;letter-spacing:.5px;}

.tier-wrap{scroll-margin-top:150px;}
.tier-head{display:flex;align-items:center;gap:12px;margin:40px 0 6px;}
.tier-head:first-child{margin-top:14px;}
.tier-head .tier-name{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink);white-space:nowrap;}
.tier-head .tier-rule{flex:1;height:1px;background:var(--ink);opacity:.85;}
.tier-head .tier-ct{font-family:var(--mono);font-size:10.5px;color:var(--gray2);letter-spacing:.5px;}
.tier-sub{font-family:var(--sans);font-size:12.5px;color:var(--gray);letter-spacing:0;margin:2px 0 16px;line-height:1.45;max-width:680px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px;}
.usage{font-family:var(--sans);font-size:12.5px;color:#C9C8C4;margin-top:12px;line-height:1.5;max-width:760px;}
.usage b{color:var(--paper);font-weight:700;}
.card{position:relative;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:15px 17px 13px;min-height:124px;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;}
.card:hover{transform:translateY(-2px);border-color:var(--ink);box-shadow:0 6px 18px -10px rgba(26,26,26,.4);}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.card .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;}
.card .firm{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:1.3px;text-transform:uppercase;color:var(--gray);}
.card .date{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.3px;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.card .date i{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
.d-fresh{color:var(--fresh);} .d-fresh i{background:var(--fresh);}
.d-aging{color:var(--aging);} .d-aging i{background:var(--aging);}
.d-stale{color:var(--stale);} .d-stale i{background:var(--stale);}
.d-undated{color:var(--gray2);} .d-undated i{background:var(--gray2);}
.card .maptitle{font-size:16px;font-weight:700;line-height:1.28;letter-spacing:-.15px;color:var(--ink);flex:1;}
.card .note{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.4px;color:var(--accent);background:var(--accent-bg);padding:2px 6px;border-radius:2px;margin-top:8px;align-self:flex-start;}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;}
.card .domain{font-family:var(--mono);font-size:10.5px;color:var(--gray2);letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card .arrow{color:var(--gray2);flex-shrink:0;transition:transform .16s ease,color .16s ease;}
.card:hover .arrow{color:var(--accent);transform:translate(2px,-2px);}
.card:hover .domain{color:var(--gray);}
.empty{font-family:var(--mono);font-size:13px;color:var(--gray);padding:60px 0;text-align:center;letter-spacing:.4px;display:none;}

footer{border-top:1px solid var(--line);max-width:1220px;margin:0 auto;padding:22px 28px 40px;font-family:var(--mono);font-size:10.5px;color:var(--gray2);letter-spacing:.5px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;}

@media (max-width:560px){
  .head-inner,.controls-inner,.pills,main,footer{padding-left:18px;padding-right:18px;}
  .sec-count{display:none;}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;}.card:hover{transform:none;}}
</style>
</head>

const CAT_CODE = {
  "AI Agents":"AG","Cross-Industry Apps":"XA","AI Compute & Data Centers":"CP","AI Infrastructure":"AI",
  "Content Generation":"CG","Cybersecurity":"CY","Defense Tech":"DF","Developer Tools":"DV",
  "Energy AI":"EN","Fintech":"FT","Healthcare":"HC",
  "Legal":"LG","Robotics & Physical AI":"RB","Semiconductors & Photonics":"SP","Voice AI":"VO"
};
const TIERS = [
  {name:"Big-Picture Maps", sub:"Whole-market overviews and top-company lists. Start here for the lay of the land.", cats:["Landscapes & Top Lists"]},
  {name:"Picks & Shovels", sub:"The AI tech stack that sells into every industry, regardless of who wins the app layer.", cats:["AI Infrastructure","AI Compute & Data Centers","Semiconductors & Photonics","AI Agents","Developer Tools","Cross-Industry Apps","Content Generation","Voice AI","Cybersecurity","Energy AI"]},
  {name:"By Industry", sub:"Maps focused on a single sector.", cats:["Defense Tech","Robotics & Physical AI","Fintech","Healthcare","Legal"]},
];
function fresh(ym){
  if(ym==null) return "undated";
  if(ym>=202601) return "fresh";
  if(ym>=202507) return "aging";
  return "stale";
}
function firmCode(f){const p=f.split(/\s+/);return p.length===1?f.slice(0,2).toUpperCase():(p[0][0]+p[1][0]).toUpperCase();}
function domain(u){try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return "";}}

const board=document.getElementById("board");
const pillsEl=document.getElementById("pills");
const emptyEl=document.getElementById("empty");
const searchEl=document.getElementById("search");
let mode="cat", frFilter="all", q="";

const ARROW='<svg class="arrow" width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M4 12L12 4M12 4H5.5M12 4V10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function cardHTML(d){
  const fr=fresh(d.ym);
  const note = d.note ? `<span class="note">${d.note}</span>` : "";
  const sub = mode==="cat" ? d.firm : d.cat;
  return `<a class="card" href="${d.url}" target="_blank" rel="noopener">
    <div class="top"><span class="firm">${sub}</span><span class="date d-${fr}"><i></i>${d.date}</span></div>
    <div class="maptitle">${d.title}</div>
    ${note}
    <div class="foot"><span class="domain">${domain(d.url)}</span>${ARROW}</div>
  </a>`;
}
function groupKey(d){return mode==="cat"?d.cat:d.firm;}

function sortItems(items){
  return items.slice().sort((a,b)=>{
    const av=a.ym||0, bv=b.ym||0;
    if(av!==bv) return bv-av;
    return a.firm.localeCompare(b.firm);
  });
}
function catBlock(name,items){
  const it=sortItems(items);
  return `<section class="section" id="sec-${name.replace(/\W+/g,'-')}">
    <div class="sec-head"><span class="code">${CAT_CODE[name]||""}</span><span class="sec-title">${name}</span>
      <span class="sec-count">${it.length} ${it.length===1?'map':'maps'}</span></div>
    <div class="grid">${it.map(cardHTML).join("")}</div></section>`;
}
function firmBlock(name,items){
  const it=sortItems(items);
  return `<section class="section" id="sec-${name.replace(/\W+/g,'-')}">
    <div class="sec-head"><span class="code firm">${firmCode(name)}</span><span class="sec-title">${name}</span>
      <span class="sec-count">${it.length} ${it.length===1?'map':'maps'}</span></div>
    <div class="grid">${it.map(cardHTML).join("")}</div></section>`;
}

function render(){
  const rows=DATA.filter(d=>{
    if(frFilter!=="all" && fresh(d.ym)!==frFilter) return false;
    if(q && !(d.firm+" "+d.title+" "+d.cat+" "+domain(d.url)).toLowerCase().includes(q)) return false;
    return true;
  });
  const byCat={};
  rows.forEach(d=>{(byCat[d.cat]=byCat[d.cat]||[]).push(d);});

  if(mode==="firm"){
    pillsEl.style.display="none";
    const byFirm={};
    rows.forEach(d=>{(byFirm[d.firm]=byFirm[d.firm]||[]).push(d);});
    const keys=Object.keys(byFirm).sort((a,b)=>a.localeCompare(b));
    board.innerHTML=keys.map(k=>firmBlock(k,byFirm[k])).join("");
  } else if(mode==="layer"){
    pillsEl.style.display="flex";
    pillsEl.innerHTML=TIERS.filter(t=>t.cats.some(c=>byCat[c])).map(t=>{
      const n=t.cats.reduce((s,c)=>s+(byCat[c]?byCat[c].length:0),0);
      return `<span class="pill" data-t="${t.name}"><b>›</b>${t.name}<span class="ct">${n}</span></span>`;
    }).join("");
    board.innerHTML=TIERS.map(t=>{
      const cats=t.cats.filter(c=>byCat[c]).sort((a,b)=>a.localeCompare(b));
      if(!cats.length) return "";
      const n=cats.reduce((s,c)=>s+byCat[c].length,0);
      const blocks=cats.map(c=>catBlock(c,byCat[c])).join("");
      return `<div class="tier-wrap" id="tier-${t.name.replace(/\W+/g,'-')}">
        <div class="tier-head"><span class="tier-name">${t.name}</span><span class="tier-rule"></span><span class="tier-ct">${n} maps</span></div>
        ${t.sub?`<p class="tier-sub">${t.sub}</p>`:''}
        ${blocks}</div>`;
    }).join("");
  } else {
    const keys=Object.keys(byCat).sort((a,b)=>a.localeCompare(b));
    pillsEl.style.display="flex";
    pillsEl.innerHTML=keys.map(k=>`<span class="pill" data-k="${k}"><b>${CAT_CODE[k]||""}</b>${k}<span class="ct">${byCat[k].length}</span></span>`).join("");
    board.innerHTML=keys.map(k=>catBlock(k,byCat[k])).join("");
  }

  emptyEl.style.display=rows.length?"none":"block";
  pillsEl.querySelectorAll(".pill").forEach(p=>p.addEventListener("click",()=>{
    const key=p.dataset.k ? ("sec-"+p.dataset.k.replace(/\W+/g,'-')) : ("tier-"+p.dataset.t.replace(/\W+/g,'-'));
    const el=document.getElementById(key);
    if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
  }));
}

document.getElementById("totalcount").textContent=DATA.length+" maps";
document.getElementById("catcount").textContent=new Set(DATA.map(d=>d.cat)).size+" categories";
document.getElementById("firmcount").textContent=new Set(DATA.map(d=>d.firm)).size+" sources";

searchEl.addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();render();});
document.getElementById("grpSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  mode=b.dataset.grp;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b));
  render();
});
const fseg=document.getElementById("freshSeg");
fseg.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  frFilter=b.dataset.fr;
  [...fseg.children].forEach(x=>x.classList.toggle("on",x===b));
  fseg.className="seg"+(frFilter!=="all"?" "+frFilter:"");
  render();
});

render();
</script>
