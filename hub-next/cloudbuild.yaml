# Build the dynamic hub image, push to Artifact Registry, deploy to Cloud Run.
# --allow-unauthenticated is intentional even with auth wired up: the gate is
# app-level (NextAuth + src/middleware.js), not Cloud Run IAM/IAP -- Cloud Run
# itself stays open so the app can serve its own sign-in page, and everything
# past that is gated by role (internal / investor / pending) in-app.
# AUTH_SECRET and AUTH_GOOGLE_SECRET come from Secret Manager, never plaintext
# here -- see docs/HUB_NEXT_ACCESS_REQUESTS.md-adjacent setup notes for how
# those secrets + the IAM bindings to read them were created.
# Substitutions: _REGION, _REPO, _SERVICE, _AUTH_GOOGLE_ID, _PIPELINE_BASE_URL.
# Set these in the trigger or pass with --substitutions.
#
# IMPORTANT: the --set-env-vars line below is the FULL, EXHAUSTIVE list of
# plain env vars for this service -- --set-env-vars replaces the whole set on
# every deploy, it does not merge. If you need a new one, add it HERE (with a
# substitution + default below), never as a one-off `gcloud run services
# update --set-env-vars` afterward -- that fix would just get silently wiped
# by the next `gcloud builds submit`. (This is exactly what happened to
# PIPELINE_BASE_URL before it was added here.)
#
# MARKET_MAP_BUCKET: a dedicated bucket for market-map images, rather than
# falling back to DI_DOCX_BUCKET (that fallback exists in src/lib/marketMap.js
# for convenience, but as of 2026-07 DI_DOCX_BUCKET has never actually been
# configured anywhere -- the docx-download route/pipeline both no-op without
# it -- so reusing it here would tangle this feature up with that unrelated,
# still-unwired one). The bucket named below must exist and the Cloud Run
# service's runtime account needs roles/storage.objectAdmin scoped to it.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      # Oscar, 2026-08-06: "it takes 10 seconds" to load -- this service had
      # no --min-instances set anywhere, so Cloud Run's default (0) scales
      # it to zero on idle, and the low, sporadic traffic pattern of an
      # internal 1-user tool means almost every real visit pays a full cold
      # start (new container boot + Next.js server startup + a fresh,
      # uncached listCompanies()/listTopVCs()/listPartnerVCs() fetch) on top
      # of whatever real query latency exists. Keeping one instance warm
      # trades a small, flat monthly cost for consistently fast loads --
      # the actual N+1 fix (listCompanies()'s own fallback query) is a
      # separate, complementary change (see companies.js/backfill-latest-
      # screen.mjs's own comments), not a substitute for this.
      - --min-instances=1

      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,ALLOWED_HD=id8investments.com,AUTH_GOOGLE_ID=${_AUTH_GOOGLE_ID},AUTH_URL=${_AUTH_URL},PIPELINE_BASE_URL=${_PIPELINE_BASE_URL},MARKET_MAP_BUCKET=${_MARKET_MAP_BUCKET}
      # ATTIO_WEBHOOK_SECRET gates /api/attio/deal-created, the public front
      # door Attio's native "deal created" workflow posts to (see
      # docs/ATTIO_HUB_SYNC.md). That route 500s with
      # `attio-webhook-secret-not-configured` until the secret exists, so
      # create it BEFORE the first deploy that includes this line:
      #   printf '%s' "$(openssl rand -hex 32)" | gcloud secrets create hub-next-attio-webhook-secret --data-file=- --project molten-crowbar-498920-q8
      # (printf, not echo -- a trailing newline in the secret makes the header
      # comparison fail; same gotcha as the other hub-next secrets.) The Cloud
      # Run runtime service account also needs roles/secretmanager.secretAccessor
      # on it, exactly as it has for the three secrets already listed here.
      - --set-secrets=AUTH_SECRET=hub-next-auth-secret:latest,AUTH_GOOGLE_SECRET=hub-next-google-secret:latest,MARKET_MAP_ADMIN_SECRET=hub-next-market-map-admin-secret:latest,ATTIO_WEBHOOK_SECRET=hub-next-attio-webhook-secret:latest
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID'
substitutions:
  _REGION: us-central1
  _REPO: id8-hub
  _SERVICE: id8-hub-next
  _AUTH_GOOGLE_ID: 137750788450-6j5ddgckliuthns31koton0cug6h162p.apps.googleusercontent.com
  # Cloud Run URLs are deterministic per service/project/region, so this stays
  # stable across redeploys. AUTH_URL pins the origin NextAuth uses to build
  # its OAuth redirect_uri -- without it, trustHost's header-based detection
  # was resolving to the container's internal bind address (0.0.0.0:8080)
  # instead of the public URL, so every Google sign-in attempt failed.
  _AUTH_URL: https://id8-hub-next-bkq2vtg6qq-uc.a.run.app
  # The "id8" pipeline service Research Chat proxies to (pipeline/app.py's
  # /research-chat). Cloud Run URLs are deterministic per service/project/
  # region, same reasoning as _AUTH_URL above.
  _PIPELINE_BASE_URL: https://id8-137750788450.us-east4.run.app
  # See the MARKET_MAP_BUCKET note above -- this exact bucket must exist
  # before deploying (step in the setup instructions creates it).
  _MARKET_MAP_BUCKET: molten-crowbar-498920-q8-market-maps
options:
  logging: CLOUD_LOGGING_ONLY
