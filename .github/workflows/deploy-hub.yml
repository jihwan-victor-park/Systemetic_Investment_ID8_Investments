name: Deploy hub to GitHub Pages

# Rebuilds and republishes the Docusaurus hub whenever its content changes —
# including the per-company screen pages that the Cloud Run screener pushes to
# hub/docs/research/companies/ via the GitHub API. n8n stays local; this only
# handles publishing the hub.
on:
  push:
    branches: [main]
    paths:
      - 'hub/**'
      - '.github/workflows/deploy-hub.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hub/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
